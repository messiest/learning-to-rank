[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "learning-to-rank"
version = "0.1.0"
description = "A modular Learning to Rank library for MSLR-WEB datasets."
requires-python = ">=3.9"
dependencies = [
    "tensorflow>=2.16.1",
    "keras-tuner>=1.4.0",
    "numpy>=1.23.5",
    "matplotlib>=3.7.0",
]

# This is the magic part for your scripts
[project.scripts]
convert-data = "scripts.convert_data:main"
train = "scripts.train_and_tune:main"
train_transformer = "scripts.train_and_tune_transformer:main"
benchmark = "scripts.benchmark:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "build",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["learning_to_rank*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=learning_to_rank --cov-report=term-missing"
filterwarnings = [
    "ignore:Type google._upb._message.MessageMapContainer uses PyType_Spec:DeprecationWarning",
    "ignore:Type google._upb._message.ScalarMapContainer uses PyType_Spec:DeprecationWarning",
]